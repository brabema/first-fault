name: Publish demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - name: Build with production App Check
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          : "${VITE_FIREBASE_API_KEY:?Set the Firebase web API key}"
          : "${VITE_FIREBASE_APP_ID:?Set the Firebase web app ID}"
          : "${VITE_FIREBASE_PROJECT_ID:?Set the Firebase project ID}"
          : "${VITE_RECAPTCHA_ENTERPRISE_SITE_KEY:?Set the public reCAPTCHA site key}"
          npm run build -- --base "${PAGES_BASE_PATH%/}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
